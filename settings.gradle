pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    id("io.micronaut.build.shared.settings") version "8.1.4"
}

// Micronaut core 5.3.0-SNAPSHOT, which carries the development-mode API, comes from Maven local, where a
// core checkout publishes it with publishToMavenLocal (pass -Dmaven.repo.local to use a private repository),
// or from the Central snapshots repository. Only io.micronaut snapshots are resolved from them. Projects
// declare their own repositories, which replace the settings ones, so they are added to each project too.
// Remove once the build moves to a core release.
def micronautSnapshotRepositories = { RepositoryHandler repositories ->
    repositories.mavenLocal {
        content {
            includeVersionByRegex("io\\.micronaut", ".*", ".*-SNAPSHOT")
        }
    }
    repositories.maven {
        url = "https://central.sonatype.com/repository/maven-snapshots/"
        mavenContent {
            snapshotsOnly()
        }
        content {
            includeGroupByRegex("io\\.micronaut(\\..*)?")
        }
    }
}
dependencyResolutionManagement {
    micronautSnapshotRepositories(repositories)
    repositories {
        mavenCentral()
    }
}
gradle.beforeProject {
    micronautSnapshotRepositories(it.repositories)
}

enableFeaturePreview 'TYPESAFE_PROJECT_ACCESSORS'

rootProject.name = 'gcp-parent'

include 'gcp-function-cloudevents'
include 'gcp-bom'
include 'gcp-common'
include 'gcp-tracing'
include 'gcp-http-client'
include 'gcp-function'
include 'gcp-function-http'
include 'gcp-function-http-test'
include 'gcp-pubsub'
include 'gcp-logging'
include 'gcp-secret-manager'
include 'gcp-serde-cloudevents'

include 'test-suite'
include 'test-suite-utils'
include 'test-suite-dev-reload'
include 'test-suite-groovy'
include 'test-suite-http-server-tck-gcp-function-http'
include 'test-suite-http-server-tck-gcp-function-http-test'
include 'test-suite-kotlin'
include 'test-suite-python'

micronautBuild {
    useStandardizedProjectNames=true

    importMicronautCatalog()
    importMicronautCatalog("micronaut-grpc")
    importMicronautCatalog("micronaut-jackson-xml")
    importMicronautCatalog("micronaut-reactor")
    importMicronautCatalog("micronaut-rxjava3")
    importMicronautCatalog("micronaut-serde")
    importMicronautCatalog("micronaut-servlet")
    importMicronautCatalog("micronaut-tracing")
    importMicronautCatalog("micronaut-validation")
}

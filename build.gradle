plugins {
    id "io.micronaut.build.internal.parent"
}

repositories {
    mavenCentral()
}
allprojects {
    configurations.matching { it.name == "runtimeClasspath" || it.name.endsWith("RuntimeClasspath") }.all {
        resolutionStrategy {
            preferProjectModules()
            // Remove once the Micronaut core BOM manages Netty 4.2.13.Final or newer.
            force "io.netty:netty-codec-http:${libs.versions.netty.get()}"
            // GHSA-prj3-ccx8-p6x4: remove once google-cloud-parametermanager's own dependency graph pulls grpc-netty-shaded 1.75.0+.
            force "io.grpc:grpc-netty-shaded:1.75.0"
            // GHSA-jhq6-gfmj-v8fx, GHSA-p47f-322f-whfh: remove once the Micronaut core BOM manages logback-core 1.5.34 or newer.
            force "ch.qos.logback:logback-core:1.5.34"
        }
    }
}
